version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: electrothina-postgres
    restart: always
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB:       postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: electrothina-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/postgres?schema=public
      AUTH_SECRET:  ${AUTH_SECRET}
      # Cloudflare R2
      AWS_REGION:            ${AWS_REGION}
      AWS_ACCESS_KEY_ID:     ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET:         ${AWS_S3_BUCKET}
      AWS_ENDPOINT:          ${AWS_ENDPOINT}
      AWS_S3_PUBLIC_URL:     ${AWS_S3_PUBLIC_URL}
      # Variables para el entrypoint (pg_isready)
      PGHOST:   db
      PGUSER:   postgres
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
